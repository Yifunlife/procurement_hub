name: 发布到 Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procurement-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: 检查并发布采购管理中心
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 发布到 Cloudflare Workers
        run: pnpm exec wrangler deploy --config dist/yifun_procurement_hub/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
